name: Ecommerce ci

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
         
      - name: Build and test with Maven
        run: mvn clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar 
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Build customer Docker image
        run: docker build -t customer:latest ./customer

      - name: Build product Docker image
        run: docker build -t product:latest ./product

      - name: Build order Docker image
        run: docker build -t order:latest ./order

      - name: Build notification Docker image
        run: docker build -t notification:latest ./notification

      - name: Build payment Docker image
        run: docker build -t payment:latest ./payment

      - name: Build eureka-server Docker image
        run: docker build -t eureka-server:latest ./eureka-server

      - name: Build gateway Docker image
        run: docker build -t gateway:latest ./gateway

      - name: CI completed
        run: echo "CI pipeline completed successfully"


      
